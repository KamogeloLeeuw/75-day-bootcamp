version: 2

models:
  - name: mart_customer_lifetime_value
    description: "Customer lifetime value with total spend and order counts"
    columns:
      - name: customer_id
        description: "Primary key"
        data_tests:
          - not_null
          - unique
      - name: lifetime_value
        description: "Total amount spent by the customer"
        data_tests:
          - not_null
      - name: total_orders
        description: "Total number of orders placed"
        data_tests:
          - not_null

  - name: mart_sales_summary
    description: "Sales performance summary by employee"
    columns:
      - name: employee_first_name
        description: "Employee first name"
        data_tests:
          - not_null
      - name: total_sales
        description: "Total revenue generated by employee"
        data_tests:
          - not_null